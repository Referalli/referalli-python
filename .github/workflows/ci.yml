# Generated by the Referalli monorepo (scripts/release/mirror-files); edits here are overwritten on the next sync.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build twine ruff pytest
      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 --output-format github .
      - run: python -m pip install -e .
      - name: Webhook verification vectors
        run: python tests/test_webhooks.py testdata/webhook-vectors.json
      - name: Unit tests
        run: |
          # pytest exits 5 when it collects nothing; that is fine.
          pytest -q tests --ignore=tests/test_webhooks.py || [ $? -eq 5 ]
      - name: Build
        run: python -m build && twine check --strict dist/*
